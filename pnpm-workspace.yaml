packages:
  - apps/*
  - packages/*
  - plugins/*/*
  - tools/*

# Supply chain (tech plan 2.6): only versions published at least 7 days ago are installed,
# and dependency build scripts run only when listed in allowBuilds.
minimumReleaseAge: 10080
strictDepBuilds: true
# Explicitly denied: optional native add-ons and a notice script pulled in by testcontainers; none is needed.
allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false
